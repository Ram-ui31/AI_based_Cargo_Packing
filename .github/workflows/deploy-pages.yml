name: Deploy ARGO website to GitHub Pages

# Auto-deploys whenever the site's frontend changes on main, plus a manual
# trigger. This is the fully static site (landing, about, demo) -- it does
# NOT include the live-pack backend, which isn't needed anymore now that
# "Use our product" points at the downloadable desktop app instead.
on:
  push:
    branches: [main]
    paths:
      - '06-app/frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 06-app/frontend

      - id: deployment
        uses: actions/deploy-pages@v4
