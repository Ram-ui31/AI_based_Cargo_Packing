name: Build ARGO desktop app

# Manual trigger only -- this is a heavy build (bundles PyTorch), no need to
# run it on every push. Go to the Actions tab -> "Build ARGO desktop app" ->
# "Run workflow" whenever you want fresh Windows/macOS/Linux builds.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the Release in the second job

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: ARGO-macos
          - os: windows-latest
            artifact_name: ARGO-windows
          - os: ubuntu-latest
            artifact_name: ARGO-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: 06-app/desktop
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (CPU-only torch, isolated from any other packages)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r ../requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          SEP=":"
          if [ "${{ matrix.os }}" == "windows-latest" ]; then SEP=";"; fi
          pyinstaller launcher.py \
            --name ARGO \
            --windowed \
            --paths ../backend \
            --add-data "../frontend${SEP}frontend" \
            --add-data "../models${SEP}models" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.websockets.wsproto_impl \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import tqdm.auto \
            --noconfirm

      # --windowed only changes macOS's output shape (produces a proper
      # ARGO.app bundle, needed so Gatekeeper treats it as one unit instead
      # of individually flagging every bundled library file); Windows/Linux
      # keep the same dist/ARGO/ARGO(.exe) onedir layout as before.
      - name: Smoke test -- confirm the built app actually starts and serves the frontend + demo data
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            ./dist/ARGO/ARGO.exe &
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            ./dist/ARGO.app/Contents/MacOS/ARGO &
          else
            ./dist/ARGO/ARGO &
          fi
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/demo_data/cherry/final_metrics.json | grep -q 200; then
              echo "Server is up and demo data served correctly."
              kill $APP_PID
              exit 0
            fi
            sleep 2
          done
          echo "Server never came up -- build is broken on this OS."
          kill $APP_PID 2>/dev/null || true
          exit 1

      - name: Zip into a single downloadable file
        run: |
          cd dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path ARGO -DestinationPath ${{ matrix.artifact_name }}.zip"
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            zip -r ${{ matrix.artifact_name }}.zip ARGO.app
          else
            zip -r ${{ matrix.artifact_name }}.zip ARGO
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: 06-app/desktop/dist/${{ matrix.artifact_name }}.zip
          retention-days: 30

  # Publishes one clean, public Release page with all 3 zips attached --
  # this (not the Actions run page above) is the link to actually hand to
  # end users. No GitHub login needed to download from here, unlike
  # Actions artifacts.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      - name: Publish/update the "latest desktop build" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: ARGO Desktop (latest build)
          body: |
            Download the file matching your computer, unzip it, and run the `ARGO` app inside (double-click on macOS/Windows).

            - **macOS** -> `ARGO-macos.zip`
            - **Windows** -> `ARGO-windows.zip`
            - **Linux** -> `ARGO-linux.zip`

            No install, no Python, no terminal needed -- it starts a local server and opens your browser automatically.
          files: downloaded/*.zip
          prerelease: true
